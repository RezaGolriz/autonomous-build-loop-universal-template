<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted development loop with independent controls</title>
  <desc id="desc">An AI agent produces bounded work, the runner captures evidence, an independent reviewer checks the change, and a human controls activation and external actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="28" fill="url(#background)"/>
  <text x="550" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">AI creates the work. Independent controls decide what passes.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="105" width="225" height="180" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <rect x="325" y="105" width="225" height="180" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="595" y="105" width="225" height="180" rx="20" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <rect x="865" y="105" width="180" height="180" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  </g>

  <text x="168" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5b21b6">AI agent</text>
  <text x="168" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Codex or Claude</text>
  <text x="168" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">produces one bounded</text>
  <text x="168" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">node output</text>
  <text x="168" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">does not self-certify</text>

  <text x="438" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Runner</text>
  <text x="438" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">runs declared checks</text>
  <text x="438" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">captures evidence</text>
  <text x="438" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">enforces boundaries</text>
  <text x="438" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">owns state transitions</text>

  <text x="708" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">Independent review</text>
  <text x="708" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">checks the exact change</text>
  <text x="708" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">against the contract</text>
  <text x="708" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">in a fresh context</text>
  <text x="708" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">cannot rewrite criteria</text>

  <text x="955" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">Human</text>
  <text x="955" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">activates and resolves</text>
  <text x="955" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">blockers</text>
  <text x="955" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">approves external</text>
  <text x="955" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">actions</text>

  <path d="M280 195 H325" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M550 195 H595" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M820 195 H865" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="110" y="350" width="880" height="115" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="550" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">The fixed loop for every work item</text>
  <text x="550" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e40af">DEFINE → DESIGN → EXECUTE → REVIEW → VALIDATE → HANDOVER</text>
  <text x="550" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Failures return to the phase that owns the defect. Missing authority becomes BLOCKED.</text>

  <path d="M708 286 C708 322 550 322 550 350" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="640" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f766e">finding routes to the phase that owns the defect</text>
  <text x="550" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Technology changes at the edges. The evidence-driven process stays the same.</text>
</svg>
