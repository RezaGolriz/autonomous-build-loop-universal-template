<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Safe initialization recommendation flow</title>
  <desc id="desc">The initializer inspects safe repository signals, proposes labeled recommendations, asks the human to confirm or replace them, and writes only paused candidate files.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="300" rx="28" fill="url(#bg)"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#164e63">Initialization stays supervised</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="90" width="200" height="125" rx="20" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
    <text x="135" y="130" font-size="19" font-weight="700" fill="#155e75">1. Inspect safely</text>
    <text x="135" y="163" font-size="15" fill="#475569">Known manifests</text>
    <text x="135" y="187" font-size="15" fill="#475569">and file names only</text>

    <rect x="280" y="90" width="200" height="125" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <text x="380" y="130" font-size="19" font-weight="700" fill="#5b21b6">2. Recommend</text>
    <text x="380" y="163" font-size="15" fill="#475569">Show the source</text>
    <text x="380" y="187" font-size="15" fill="#475569">Never run commands</text>

    <rect x="525" y="90" width="200" height="125" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="625" y="130" font-size="19" font-weight="700" fill="#1d4ed8">3. Human decides</text>
    <text x="625" y="163" font-size="15" fill="#475569">Accept or replace</text>
    <text x="625" y="187" font-size="15" fill="#475569">every suggestion</text>

    <rect x="770" y="90" width="195" height="125" rx="20" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="868" y="130" font-size="19" font-weight="700" fill="#047857">4. Write candidate</text>
    <text x="868" y="163" font-size="15" fill="#475569">State remains</text>
    <text x="868" y="187" font-size="18" font-weight="700" fill="#047857">PAUSED</text>
  </g>
  <path d="M235 152 H275" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M480 152 H520" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M725 152 H765" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">No inferred project command is executed. No automation is activated.</text>
</svg>
