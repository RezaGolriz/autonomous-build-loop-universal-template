<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">One supervisor, several isolated work packages</title><desc id="desc">Chat, MCP and CLI use one supervisor. The supervisor checks permission and assigns isolated workspaces to the selected agents. Each package passes the same six phases, and a person decides acceptance.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4352d7" stroke-width="2"/></marker></defs>
<rect width="1160" height="620" rx="20" fill="#f4f5f8"/>
<g font-family="Arial,sans-serif" fill="#172335"><text x="45" y="48" font-size="25" font-weight="700">Choose your team. Keep one set of rules.</text><text x="45" y="77" font-size="15" fill="#59677c">Sequential by default · parallel only when selected · shell commands remain available</text>
<g fill="white" stroke="#d8e0ea" stroke-width="2"><rect x="45" y="110" width="250" height="105" rx="12"/><rect x="390" y="110" width="350" height="105" rx="12"/><rect x="835" y="110" width="280" height="105" rx="12"/><rect x="80" y="295" width="450" height="145" rx="12"/><rect x="630" y="295" width="450" height="145" rx="12"/><rect x="350" y="520" width="460" height="65" rx="12"/></g>
<text x="67" y="148" font-size="19" font-weight="700">Your chat or terminal</text><text x="67" y="177" font-size="15">Codex · Claude · MCP · CLI</text>
<text x="412" y="145" font-size="19" font-weight="700">Supervisor</text><text x="412" y="175" font-size="15">Checks scope, approval and budgets</text><text x="412" y="197" font-size="15">Keeps jobs and checkpoints</text>
<text x="857" y="145" font-size="19" font-weight="700">Your selected team</text><text x="857" y="175" font-size="15">Builder + independent reviewer</text><text x="857" y="197" font-size="15">Exact permitted models and runtimes</text>
<text x="105" y="329" font-size="20" font-weight="700">Package A: Login</text><text x="105" y="357" font-size="15">Own workspace, state, agent session and budget</text><text x="105" y="390" font-size="13">DEFINE → DESIGN → EXECUTE → REVIEW</text><text x="105" y="415" font-size="13">→ VALIDATE → HANDOVER</text>
<text x="655" y="329" font-size="20" font-weight="700">Package B: Export</text><text x="655" y="357" font-size="15">Own workspace, state, agent session and budget</text><text x="655" y="390" font-size="13">DEFINE → DESIGN → EXECUTE → REVIEW</text><text x="655" y="415" font-size="13">→ VALIDATE → HANDOVER</text>
<text x="374" y="559" font-size="17" font-weight="700">You inspect, accept and decide integration</text></g>
<g fill="none" stroke="#4352d7" stroke-width="2" marker-end="url(#arrow)"><path d="M295 162H390"/><path d="M835 162H740"/><path d="M565 215V260H305V295"/><path d="M565 260H855V295"/><path d="M305 440V475H470V520"/><path d="M855 440V475H690V520"/></g>
<text x="42" y="602" font-family="Arial,sans-serif" font-size="12" fill="#59677c">Architecture illustration. Native host support and API access are checked before use; no automatic merge or acceptance.</text></svg>
