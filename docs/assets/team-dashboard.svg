<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">How to read the team dashboard</title><desc id="desc">Illustration of overall progress above package cards and details. Progress, human acceptance and integration are separate.</desc>
<rect width="1200" height="760" rx="18" fill="#f4f5f8"/>
<g font-family="Arial,sans-serif" fill="#172335"><text x="40" y="48" font-size="26" font-weight="700">Several topics. One clear view.</text><text x="40" y="78" font-size="15" fill="#59677c">Parallel · maximum 2 packages · maximum 3 agent sessions</text>
<g fill="white" stroke="#d8e0ea"><rect x="40" y="106" width="1120" height="156" rx="14"/><rect x="40" y="294" width="530" height="156" rx="12"/><rect x="40" y="466" width="530" height="156" rx="12"/><rect x="594" y="294" width="566" height="398" rx="14"/></g>
<text x="62" y="140" font-size="20" font-weight="700">Overall progress · all packages</text><text x="1080" y="149" font-size="30" font-weight="700">68%</text>
<rect x="62" y="165" width="1076" height="12" rx="6" fill="#e8ecf3"/><rect x="62" y="165" width="732" height="12" rx="6" fill="#4352d7"/>
<text x="62" y="203" font-size="15">13 / 19 verified criteria · 4 / 5 packages assessed</text><text x="62" y="231" font-size="14" fill="#59677c">0 accepted by a person · 0 integrated · one package has no criteria yet</text>
<text x="62" y="325" font-size="13" fill="#59677c">WI-101 · managed API agent</text><text x="440" y="325" font-size="13" fill="#4352d7">EXECUTE</text><text x="62" y="360" font-size="21" font-weight="700">Login and session renewal</text><rect x="62" y="381" width="486" height="8" rx="4" fill="#e8ecf3"/><rect x="62" y="381" width="292" height="8" rx="4" fill="#4352d7"/><text x="62" y="422" font-size="14">3 / 5 criteria checked · 60%</text>
<text x="62" y="497" font-size="13" fill="#59677c">WI-102 · independent reviewer</text><text x="440" y="497" font-size="13" fill="#4352d7">REVIEW</text><text x="62" y="532" font-size="21" font-weight="700">CSV export with filters</text><rect x="62" y="553" width="486" height="8" rx="4" fill="#e8ecf3"/><rect x="62" y="553" width="389" height="8" rx="4" fill="#4352d7"/><text x="62" y="594" font-size="14">4 / 5 criteria checked · 80%</text>
<text x="619" y="334" font-size="21" font-weight="700">Package details</text><text x="619" y="374" font-size="15">Who is working? Which model was reported?</text><text x="619" y="410" font-size="15">Current phase and next step</text><text x="619" y="446" font-size="15">Workspace, revision and runner evidence</text><text x="619" y="494" font-size="18" font-weight="700">Time and recovery</text><text x="619" y="530" font-size="15">22 / 45 minutes · extension 1 / 2</text><text x="619" y="566" font-size="15">Checkpoint: 2 minutes ago · attempt 1 / 3</text><text x="619" y="602" font-size="15">Heartbeat: reachability, not proof of progress</text><text x="619" y="653" font-size="14" fill="#59677c">A blocker says who must act and what to do next.</text>
<text x="40" y="726" font-size="13" fill="#59677c">Reading guide with example values, not a screenshot or live evidence. Gate-based progress is labelled separately when per-criterion evidence is absent.</text></g></svg>
